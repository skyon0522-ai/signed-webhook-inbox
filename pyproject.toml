[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signed-webhook-inbox"
version = "0.1.0"
description = "A local signed webhook receiver with durable, byte-exact deduplication"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "skyon0522-ai"}]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.16.10", "build==1.3.0", "pytest==8.4.2"]

[project.scripts]
signed-webhook-inbox = "signed_webhook_inbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"signed_webhook_inbox._vendor.standardwebhooks" = ["LICENSE", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["upstream", "src/signed_webhook_inbox/_vendor", ".local-tools", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
